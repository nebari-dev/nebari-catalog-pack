name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Type-check
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # The Go binary embeds web/dist; a committed placeholder keeps `go build`
      # working without a frontend build (the real SPA is built in the web job
      # and the image/Docker stage).
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  helm:
    name: Helm lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint chart
      - name: Template (NebariApp disabled)
        run: helm template catalog chart
      - name: Template (NebariApp enabled)
        run: |
          helm template catalog chart \
            --set nebariapp.enabled=true \
            --set nebariapp.hostname=catalog.nebari.example.com \
            --set catalog.gitops.repoURL=https://github.com/nebari-dev/example.git \
            --set catalog.gitops.tokenSecret.name=gitops-token
