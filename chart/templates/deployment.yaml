apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nebari-catalog-pack.fullname" . }}
  labels:
    {{- include "nebari-catalog-pack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nebari-catalog-pack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nebari-catalog-pack.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nebari-catalog-pack.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: catalog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CATALOG_LISTEN
              value: ":8080"
            - name: CATALOG_BASE_PATH
              value: {{ .Values.catalog.basePath | quote }}
            - name: CATALOG_DRY_RUN
              value: {{ .Values.catalog.dryRun | quote }}
            # Registry discovery
            - name: CATALOG_REGISTRY_API
              value: {{ .Values.catalog.registry.api | quote }}
            - name: CATALOG_REGISTRY_OCI
              value: {{ .Values.catalog.registry.oci | quote }}
            - name: CATALOG_REGISTRY_NAMESPACE
              value: {{ .Values.catalog.registry.namespace | quote }}
            - name: CATALOG_REGISTRY_CHART_PREFIX
              value: {{ .Values.catalog.registry.chartPrefix | quote }}
            {{- with .Values.catalog.registry.ociPullBase }}
            - name: CATALOG_REGISTRY_OCI_PULL_BASE
              value: {{ . | quote }}
            {{- end }}
            - name: CATALOG_METADATA_URL_TEMPLATE
              value: {{ .Values.catalog.metadataURLTemplate | quote }}
            # GitOps target
            - name: CATALOG_GITOPS_REPO_URL
              value: {{ .Values.catalog.gitops.repoURL | quote }}
            - name: CATALOG_GITOPS_BRANCH
              value: {{ .Values.catalog.gitops.branch | quote }}
            - name: CATALOG_GITOPS_PATH
              value: {{ .Values.catalog.gitops.path | quote }}
            - name: CATALOG_GIT_AUTHOR_NAME
              value: {{ .Values.catalog.gitops.author.name | quote }}
            - name: CATALOG_GIT_AUTHOR_EMAIL
              value: {{ .Values.catalog.gitops.author.email | quote }}
            {{- if .Values.catalog.gitops.tokenSecret.name }}
            - name: CATALOG_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalog.gitops.tokenSecret.name }}
                  key: {{ .Values.catalog.gitops.tokenSecret.key }}
            {{- end }}
            {{- if .Values.catalog.gitops.sshKeySecret.name }}
            - name: CATALOG_GITOPS_SSH_KEY_PATH
              value: "/etc/git-ssh/{{ .Values.catalog.gitops.sshKeySecret.key }}"
            {{- end }}
            # ArgoCD nudge
            - name: CATALOG_ARGOCD_ENABLED
              value: {{ .Values.catalog.argocd.enabled | quote }}
            - name: CATALOG_ARGOCD_NAMESPACE
              value: {{ .Values.catalog.argocd.namespace | quote }}
            - name: CATALOG_ARGOCD_ROOT_APP
              value: {{ .Values.catalog.argocd.rootApp | quote }}
            # Generated Application conventions
            - name: CATALOG_APP_PROJECT
              value: {{ .Values.catalog.install.project | quote }}
            - name: CATALOG_APP_NAMESPACE
              value: {{ .Values.catalog.install.namespace | quote }}
            - name: CATALOG_APP_SYNC_WAVE
              value: {{ .Values.catalog.install.syncWave | quote }}
            - name: CATALOG_APP_PART_OF
              value: {{ .Values.catalog.install.partOf | quote }}
            - name: CATALOG_APP_MANAGED_BY
              value: {{ include "nebari-catalog-pack.name" . | quote }}
            - name: CATALOG_DOMAIN
              value: {{ .Values.catalog.install.domain | quote }}
            - name: CATALOG_PACK_GIT_TEMPLATE
              value: {{ .Values.catalog.install.gitTemplate | quote }}
            - name: CATALOG_PREFER_OCI
              value: {{ .Values.catalog.install.preferOCI | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.catalog.basePath }}/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ .Values.catalog.basePath }}/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.catalog.gitops.sshKeySecret.name }}
            - name: git-ssh
              mountPath: /etc/git-ssh
              readOnly: true
            {{- end }}
      volumes:
        # Writable scratch for git clones (root filesystem is read-only).
        - name: tmp
          emptyDir: {}
        {{- if .Values.catalog.gitops.sshKeySecret.name }}
        - name: git-ssh
          secret:
            secretName: {{ .Values.catalog.gitops.sshKeySecret.name }}
            defaultMode: 0400
        {{- end }}
