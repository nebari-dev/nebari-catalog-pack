apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebari-catalog-pack.fullname" . }}
  labels:
    {{- include "nebari-catalog-pack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "nebari-catalog-pack.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
